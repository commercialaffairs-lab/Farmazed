<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear cuenta | Farmazed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(160deg, #0d4f80 0%, #2190d7 55%, #1572b0 100%);
      font-family: 'Segoe UI', -apple-system, sans-serif;
    }
    .fz-card { background:#fff; border-radius:8px; box-shadow:0 12px 48px rgba(0,0,0,.28); width:100%; max-width:460px; margin:24px 16px; overflow:hidden; }
    .fz-card-top { background:linear-gradient(135deg,#0d4f80,#2190d7); padding:28px 32px; text-align:center; color:#fff; }
    .fz-card-body { padding:32px; }
  </style>
</head>
<body>

<div class="fz-card">
  <div class="fz-card-top">
    <div style="font-size:1.4rem;font-weight:700">Farmazed</div>
    <div style="font-size:.8rem;opacity:.8;text-transform:uppercase;letter-spacing:.08em;margin-top:4px">Crear cuenta</div>
  </div>
  <div class="fz-card-body">

    <div id="done-msg" class="d-none">
      <div class="alert alert-success">
        Cuenta creada. Te mandamos un correo a <strong id="done-email"></strong> para
        verificarla — sin verificarlo no puedes entrar al portal todavía.
      </div>
      <a href="/login.html" class="btn btn-primary w-100">Ir a iniciar sesión</a>
    </div>

    <form id="registro-form">
      <div class="mb-3">
        <label class="form-label small">Nombre</label>
        <input type="text" class="form-control" id="r-nombre" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Correo</label>
        <input type="email" class="form-control" id="r-correo" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Contraseña</label>
        <input type="password" class="form-control" id="r-password" minlength="8" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Confirmar contraseña</label>
        <input type="password" class="form-control" id="r-password-confirm" minlength="8" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Teléfono</label>
        <input type="tel" class="form-control" id="r-telefono" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">Empresa</label>
        <input type="text" class="form-control" id="r-empresa" required>
      </div>
      <div class="mb-3">
        <label class="form-label small">País</label>
        <input type="text" class="form-control" id="r-pais" required>
      </div>
      <div class="alert alert-danger d-none" id="form-error"></div>
      <button type="submit" class="btn btn-primary w-100" id="btn-submit">Crear cuenta</button>
      <div class="text-center mt-3">
        <a href="/login.html" class="small">Ya tengo cuenta — iniciar sesión</a>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { login, auth, API_BASE } from './portal/js/auth.js';
  import { sendEmailVerification } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

  function show(id) { document.getElementById(id).classList.remove('d-none'); }
  function hide(id) { document.getElementById(id).classList.add('d-none'); }

  document.getElementById('registro-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formError = document.getElementById('form-error');
    const btn        = document.getElementById('btn-submit');
    hide('form-error');

    const nombre   = document.getElementById('r-nombre').value.trim();
    const correo   = document.getElementById('r-correo').value.trim();
    const password = document.getElementById('r-password').value;
    const passwordConfirm = document.getElementById('r-password-confirm').value;
    const telefono = document.getElementById('r-telefono').value.trim();
    const empresa  = document.getElementById('r-empresa').value.trim();
    const pais     = document.getElementById('r-pais').value.trim();

    if (password !== passwordConfirm) {
      formError.textContent = 'Las contraseñas no coinciden.';
      show('form-error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creando cuenta…';
    try {
      // TAREA 34 (§H.15): ?plan=consulta|registro|empresarial desde los
      // botones "Solicitar" del landing — se guarda en la empresa desde el
      // alta misma. Público — admin SDK crea la cuenta del lado del
      // servidor, por eso es un fetch directo (sin token: todavía no
      // existe la sesión).
      const plan = new URLSearchParams(window.location.search).get('plan');
      const res = await fetch(`${API_BASE}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, correo, password, telefono, empresa, pais, plan }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);

      // La cuenta se creó del lado del servidor (admin SDK) sin iniciar
      // sesión — hay que loguearse de verdad acá para que
      // sendEmailVerification() tenga un auth.currentUser real.
      await login(correo, password);
      await sendEmailVerification(auth.currentUser);

      document.getElementById('done-email').textContent = correo;
      document.getElementById('registro-form').classList.add('d-none');
      show('done-msg');
    } catch (err) {
      formError.textContent = err.message;
      show('form-error');
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }
  });
</script>
</body>
</html>
