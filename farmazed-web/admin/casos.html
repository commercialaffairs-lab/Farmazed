<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmazed Admin — Expedientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --fz-blue:#1B4F8A; --fz-navy:#0F3260; --fz-green:#3A7D44; }
    body  { background:#f0f4fa; }
    .sidebar { width:220px; background:var(--fz-navy); min-height:100vh; flex-shrink:0; }
    .sidebar a { color:rgba(255,255,255,.7); text-decoration:none; display:block; padding:.6rem 1.25rem; font-size:.88rem; border-radius:6px; transition:.15s; }
    .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,.12); color:#fff; }
    .sidebar .section-label { color:rgba(255,255,255,.35); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; padding:.5rem 1.25rem; margin-top:.75rem; }
    .main { flex:1; overflow-x:auto; }
    .topbar { background:#fff; border-bottom:1px solid #dee2e6; padding:.75rem 1.5rem; }
    .case-row { cursor:pointer; transition:.1s; }
    .case-row:hover { background:#f0f4fa !important; }
    .filter-chip { border-radius:20px; font-size:.78rem; padding:.25rem .75rem; cursor:pointer; }
    .filter-chip.active { background:var(--fz-blue); color:#fff; border-color:var(--fz-blue); }
  </style>
</head>
<body class="d-flex">

<!-- Sidebar -->
<div class="sidebar py-3 d-flex flex-column">
  <div class="px-4 mb-4">
    <div style="font-family:Georgia,serif;color:#fff;font-size:1.2rem;font-weight:700">Farmazed</div>
    <div style="color:rgba(255,255,255,.4);font-size:.72rem">Admin Panel</div>
  </div>
  <div class="section-label">Gestión</div>
  <a href="/admin/casos.html" class="active"><i class="bi bi-folder2-open me-2"></i>Expedientes</a>
  <a href="/admin/bandeja.html"><i class="bi bi-inbox me-2"></i>Mi Bandeja</a>
  <a href="/admin/cotizaciones.html"><i class="bi bi-receipt me-2"></i>Cotizaciones</a>
  <a href="/admin/formularios.html"><i class="bi bi-file-earmark-text me-2"></i>Formularios</a>
  <a href="/admin/empresas.html" id="nav-empresas" style="display:none"><i class="bi bi-building me-2"></i>Empresas</a>
  <a href="#"><i class="bi bi-qr-code me-2"></i>QR Scans</a>
  <div class="section-label">Sistema</div>
  <a href="/admin/configuracion.html" id="nav-configuracion" style="display:none"><i class="bi bi-gear me-2"></i>Configuración</a>
  <a href="#" id="sidebar-logout"><i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión</a>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar d-flex align-items-center justify-content-between">
    <h6 class="mb-0 fw-bold">Expedientes de Clientes</h6>
    <div class="d-flex align-items-center gap-3">
      <input type="text" class="form-control form-control-sm" id="search-input" placeholder="Buscar producto o cliente..." style="width:220px">
      <span class="text-muted small" id="admin-name"></span>
    </div>
  </div>

  <div class="p-4">
    <!-- Stats -->
    <div class="row g-3 mb-4" id="stats-row">
      <div class="col"><div class="card border-0 shadow-sm text-center p-3"><div class="fw-bold fs-4" id="s-total">—</div><div class="small text-muted">Total</div></div></div>
      <div class="col"><div class="card border-0 shadow-sm text-center p-3"><div class="fw-bold fs-4 text-warning" id="s-manual">—</div><div class="small text-muted">Control manual</div></div></div>
      <div class="col"><div class="card border-0 shadow-sm text-center p-3"><div class="fw-bold fs-4 text-danger" id="s-pending-docs">—</div><div class="small text-muted">Docs Pendientes</div></div></div>
      <div class="col"><div class="card border-0 shadow-sm text-center p-3"><div class="fw-bold fs-4 text-info" id="s-post">—</div><div class="small text-muted">Post-presentación</div></div></div>
      <div class="col"><div class="card border-0 shadow-sm text-center p-3"><div class="fw-bold fs-4 text-success" id="s-approved">—</div><div class="small text-muted">Aprobados</div></div></div>
    </div>

    <!-- Filters (generados desde los estados presentes en los casos cargados) -->
    <div class="d-flex gap-2 flex-wrap mb-3" id="filter-chips">
      <button class="btn btn-outline-secondary filter-chip active" data-status="">Todos</button>
    </div>

    <!-- Table -->
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0" id="cases-table">
          <thead class="table-light">
            <tr>
              <th class="small fw-semibold ps-4">Producto</th>
              <th class="small fw-semibold">Módulo</th>
              <th class="small fw-semibold">Tipo</th>
              <th class="small fw-semibold">Cliente</th>
              <th class="small fw-semibold">Estado</th>
              <th class="small fw-semibold">Docs</th>
              <th class="small fw-semibold">Actualizado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cases-tbody">
            <tr><td colspan="8" class="text-center py-5"><div class="spinner-border text-primary spinner-border-sm"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initBackoffice, esc, logout } from '../portal/js/auth.js';
  import api from '../portal/js/api.js';
  import { getFullMeta, colorForCaseStatus } from '../portal/js/status_ui.js';

  const ICON = { medicamentos:'💊', cosmeticos:'🧴', higienicos:'🧼', plaguicidas:'🌿', excepcion:'🚨', publicidad:'📢' };

  let allCases = [];
  let statusMeta   = null; // GET /api/meta/statuses — labels/manual/terminal
  let activeFilter = '';
  let searchTerm   = '';

  async function init() {
    // TAREA 15/E3 parte 2: esta pantalla ya no es solo del admin — el staff
    // (analista/abogado/regente) también entra aquí (el backend ya filtra la
    // lista a solo sus casos asignados); "Mi bandeja" es su vista recomendada.
    if (!(await initBackoffice())) return;
    statusMeta = await getFullMeta();
    await loadCases();
  }

  async function loadCases() {
    try {
      const { cases } = await api.listCases();
      allCases = cases;

      document.getElementById('s-total').textContent        = cases.length;
      document.getElementById('s-manual').textContent       = cases.filter(c => statusMeta.manual.includes(c.status)).length;
      document.getElementById('s-pending-docs').textContent = cases.filter(c => c.status === 'pending_docs').length;
      document.getElementById('s-post').textContent         = cases.filter(c => statusMeta.postPresentacion.includes(c.status)).length;
      document.getElementById('s-approved').textContent     = cases.filter(c => c.status === 'aprobado').length;

      renderFilterChips();
      renderTable();
    } catch (e) {
      document.getElementById('cases-tbody').innerHTML = `<tr><td colspan="8" class="text-danger text-center">${esc(e.message)}</td></tr>`;
    }
  }

  // Un chip por cada estado que efectivamente tiene casos cargados — con 21
  // estados posibles, mostrar los 21 vacíos sería ruido, no ayuda al admin.
  function renderFilterChips() {
    const container = document.getElementById('filter-chips');
    const present = [...new Set(allCases.map(c => c.status))];
    const chips = present.map(s => {
      const label = statusMeta.statuses.includes(s) ? (statusMeta.meta[s]?.label || s) : `${s} (sin migrar)`;
      const count = allCases.filter(c => c.status === s).length;
      return `<button class="btn btn-outline-secondary filter-chip" data-status="${esc(s)}">${esc(label)} (${count})</button>`;
    }).join('');
    container.innerHTML = `<button class="btn btn-outline-secondary filter-chip active" data-status="">Todos</button>${chips}`;
    container.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.status;
        renderTable();
      });
    });
  }

  function renderTable() {
    const filtered = allCases.filter(c => {
      const matchStatus = !activeFilter || c.status === activeFilter;
      const q = searchTerm.toLowerCase();
      const matchSearch = !q || (c.productName||'').toLowerCase().includes(q) || (c.clientEmail||'').toLowerCase().includes(q);
      return matchStatus && matchSearch;
    });
    const tbody = document.getElementById('cases-tbody');
    if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Sin expedientes</td></tr>'; return; }
    tbody.innerHTML = filtered.map(c => {
      const date = c.updatedAt ? new Date(c.updatedAt).toLocaleDateString('es-PA',{day:'2-digit',month:'short'}) : '—';
      // Ajuste TAREA 8 (Rick, 29-sep): un status fuera del enum de 21 (caso
      // legacy sin migrar, D07) es gris + "(sin migrar)" explícito — antes
      // se mostraba el string crudo sin distinguirlo de una fase real.
      let label;
      if (statusMeta.statuses.includes(c.status)) {
        label = statusMeta.meta[c.status]?.label || c.status;
      } else {
        console.warn(`[casos.html] caso ${c.id}: status "${c.status}" no está en el enum de 21 (sin migrar).`);
        label = `${c.status} (sin migrar)`;
      }
      const badgeClass = `bg-${colorForCaseStatus(c.status, statusMeta)}`;
      return `<tr class="case-row" onclick="window.location.href='/admin/expediente.html?id=${encodeURIComponent(c.id)}'">
        <td class="ps-4 py-3">
          <div class="fw-semibold small">${ICON[c.tramiteType]||'📋'} ${esc(c.productName || '(sin nombre)')}</div>
          <div class="text-muted" style="font-size:.72rem">${esc(c.id)}</div>
        </td>
        <td class="small">${esc(c.tramiteType)}</td>
        <td class="small">${esc(c.tipoRegistro||'—')}</td>
        <td class="small text-muted">${esc(c.clientEmail)}</td>
        <td><span class="badge ${badgeClass} rounded-pill">${esc(label)}</span></td>
        <td class="small">—</td>
        <td class="small text-muted">${date}</td>
        <td><i class="bi bi-chevron-right text-muted"></i></td>
      </tr>`;
    }).join('');
  }

  document.getElementById('search-input').addEventListener('input', e => { searchTerm = e.target.value; renderTable(); });

  init();
</script>
</body>
</html>
