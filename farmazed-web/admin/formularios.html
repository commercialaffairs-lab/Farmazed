<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmazed Admin — Formularios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --fz-blue:#1B4F8A; --fz-navy:#0F3260; --fz-green:#3A7D44; }
    body  { background:#f0f4fa; }
    .sidebar { width:220px; background:var(--fz-navy); min-height:100vh; flex-shrink:0; }
    .sidebar a { color:rgba(255,255,255,.7); text-decoration:none; display:block; padding:.6rem 1.25rem; font-size:.88rem; border-radius:6px; transition:.15s; }
    .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,.12); color:#fff; }
    .sidebar .section-label { color:rgba(255,255,255,.35); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; padding:.5rem 1.25rem; margin-top:.75rem; }
    .main { flex:1; overflow-x:auto; }
    .topbar { background:#fff; border-bottom:1px solid #dee2e6; padding:.75rem 1.5rem; }
    .form-row { display:flex; align-items:flex-start; gap:.75rem; padding:.65rem .9rem; border-bottom:1px solid #f0f0f0; }
    .form-row:last-child { border-bottom:none; }
    .form-num { font-weight:700; color:var(--fz-blue); min-width:28px; font-size:.85rem; }
  </style>
</head>
<body class="d-flex">

<!-- Sidebar: lo pinta montarSidebar (portal/js/auth.js) desde initBackoffice; el mismo menú en todas las páginas -->
<nav class="sidebar py-3 d-flex flex-column" id="fz-sidebar" data-activo="formularios" aria-label="Menú"></nav>

<!-- Main -->
<div class="main">
  <div class="topbar d-flex align-items-center justify-content-between">
    <h6 class="mb-0 fw-bold">Biblioteca de Formularios (R14)</h6>
    <span class="text-muted small" id="user-name"></span>
  </div>

  <div class="p-4">
    <p class="text-muted small mb-3">
      Los 13 formularios/declaraciones juradas canónicos (serie F08-Form-1..13). F1 y
      F2 (marcados "por confirmar" acá, sin contexto de caso) dependen de la
      representación del titular — ver el expediente de cada caso para su valor real.
    </p>
    <div class="card border-0 shadow-sm">
      <div id="formularios-list">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initBackoffice, esc, logout } from '../portal/js/auth.js';
  import api from '../portal/js/api.js';

  const APLICA_LABEL = {
    medicamentos_regular:  'Medicamentos — Regular',
    medicamentos_abreviado: 'Medicamentos — Abreviado',
    reconocimiento_mutuo:  'Reconocimiento Mutuo',
    renovaciones:          'Renovaciones',
    suplementos:           'Suplementos',
    intercambiabilidad:    'Intercambiabilidad',
    no_comercializados:    'No comercializados',
    // TAREA 28 (§H.11): F3 y F10 ya no son "por_confirmar" en biblioteca.
    medicamentos_siempre: 'Siempre (medicamentos)',
    nuevo_registro:       'Registro nuevo',
  };
  const FIRMA_LABEL = {
    titular: 'Titular', representante_legal: 'Representante Legal',
    fabricante: 'Fabricante', farmaceutico: 'Farmacéutico', casa_matriz: 'Casa Matriz',
  };

  async function init() {
    if (!(await initBackoffice())) return;

    try {
      const { formularios } = await api.getFormularios();
      render(formularios);
    } catch (e) {
      document.getElementById('formularios-list').innerHTML = `<div class="alert alert-danger m-3">${esc(e.message)}</div>`;
    }
  }

  function render(formularios) {
    document.getElementById('formularios-list').innerHTML = formularios.map(f => {
      const aplicaHtml = f.aplica === 'por_confirmar'
        ? `<span class="badge bg-warning-subtle text-warning border border-warning-subtle">Por confirmar</span>
           <div class="text-muted small mt-1">${esc(f.notaAplicacion || '')}</div>`
        : f.aplica.map(tag => `<span class="badge bg-primary-subtle text-primary border border-primary-subtle me-1">${esc(APLICA_LABEL[tag] || tag)}</span>`).join('');

      const firmaHtml = f.firma.map(r => esc(FIRMA_LABEL[r] || r)).join(' / ');

      return `<div class="form-row">
        <div class="form-num">${String(f.numero).padStart(2, '0')}</div>
        <div class="flex-grow-1">
          <div class="fw-semibold small">${esc(f.titulo)}</div>
          <div class="text-muted small mt-1">Firma: ${firmaHtml}</div>
          <div class="mt-1">${aplicaHtml}</div>
        </div>
        <div class="flex-shrink-0">
          <a class="btn btn-sm btn-outline-primary" href="/formularios/${esc(f.archivo)}" download>
            <i class="bi bi-download"></i> Descargar
          </a>
        </div>
      </div>`;
    }).join('');
  }

  init();
</script>
</body>
</html>
