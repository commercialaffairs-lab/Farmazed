<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmazed — Mi Bandeja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --fz-blue:#1B4F8A; --fz-navy:#0F3260; --fz-green:#3A7D44; }
    body  { background:#f0f4fa; }
    .sidebar { width:220px; background:var(--fz-navy); min-height:100vh; flex-shrink:0; }
    .sidebar a { color:rgba(255,255,255,.7); text-decoration:none; display:block; padding:.6rem 1.25rem; font-size:.88rem; border-radius:6px; transition:.15s; }
    .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,.12); color:#fff; }
    .sidebar .section-label { color:rgba(255,255,255,.35); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; padding:.5rem 1.25rem; margin-top:.75rem; }
    .main { flex:1; overflow-x:auto; }
    .topbar { background:#fff; border-bottom:1px solid #dee2e6; padding:.75rem 1.5rem; }
    .bandeja-row { cursor:pointer; transition:.1s; }
    .bandeja-row:hover { background:#f0f4fa !important; }
    .accion-actionable { background:#fff3cd; color:#664d03; }
    .accion-waiting    { background:#e9ecef; color:#6c757d; }
  </style>
</head>
<body class="d-flex">

<!-- Sidebar -->
<div class="sidebar py-3 d-flex flex-column">
  <div class="px-4 mb-4">
    <div style="font-family:Georgia,serif;color:#fff;font-size:1.2rem;font-weight:700">Farmazed</div>
    <div style="color:rgba(255,255,255,.4);font-size:.72rem">Admin Panel</div>
  </div>
  <div class="section-label">Gestión</div>
  <a href="/admin/casos.html"><i class="bi bi-folder2-open me-2"></i>Expedientes</a>
  <a href="/admin/bandeja.html" class="active"><i class="bi bi-inbox me-2"></i>Mi Bandeja</a>
  <a href="/admin/cotizaciones.html"><i class="bi bi-receipt me-2"></i>Cotizaciones</a>
  <a href="/admin/formularios.html"><i class="bi bi-file-earmark-text me-2"></i>Formularios</a>
  <a href="/admin/empresas.html" id="nav-empresas" style="display:none"><i class="bi bi-building me-2"></i>Empresas</a>
  <a href="/admin/precios.html" id="nav-precios" style="display:none"><i class="bi bi-cash-coin me-2"></i>Precios</a>
  <div class="section-label">Sistema</div>
  <a href="/admin/configuracion.html" id="nav-configuracion" style="display:none"><i class="bi bi-gear me-2"></i>Configuración</a>
  <a href="#" id="sidebar-logout"><i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión</a>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar d-flex align-items-center justify-content-between">
    <h6 class="mb-0 fw-bold">Mi Bandeja</h6>
    <span class="text-muted small" id="user-name"></span>
  </div>

  <div class="p-4">
    <p class="text-muted small mb-3" id="rol-intro"></p>

    <!-- TAREA 32 (§H.13): leads de registro abierto — empresas con captación
         completada que Farmazed todavía no revisó. Visible para staff y
         admin (orgs.read_leads), no son expedientes (no tienen caso
         todavía) — card aparte, arriba de la bandeja de casos. -->
    <div class="card border-0 shadow-sm mb-3 d-none" id="leads-card">
      <div class="card-header bg-white fw-semibold small">Clientes nuevos — revisar captación</div>
      <div class="list-group list-group-flush" id="leads-list"></div>
    </div>

    <!-- TAREA 34 (§H.15): "Enviar consulta" del hero — SIN cuenta todavía
         (a diferencia de la card de arriba). -->
    <div class="card border-0 shadow-sm mb-3 d-none" id="contact-leads-card">
      <div class="card-header bg-white fw-semibold small">Consultas del sitio (sin cuenta)</div>
      <div class="list-group list-group-flush" id="contact-leads-list"></div>
    </div>

    <!-- Avisos de PayPal que una persona tiene que mirar (pago fallido, reembolso,
         cobro sin registro, suscripción anterior sin cancelar). Solo admin. -->
    <div class="card border-0 shadow-sm mb-3 d-none" id="revisiones-card">
      <div class="card-header bg-white fw-semibold small">Pagos por revisar</div>
      <div class="list-group list-group-flush" id="revisiones-list"></div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0" id="bandeja-table">
          <thead class="table-light">
            <tr>
              <th class="small fw-semibold ps-4">Producto</th>
              <th class="small fw-semibold">Expediente</th>
              <th class="small fw-semibold">Fase actual</th>
              <th class="small fw-semibold">Acción pendiente</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bandeja-tbody">
            <tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary spinner-border-sm"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initBackoffice, esc, logout } from '../portal/js/auth.js';
  import { avisar, confirmar, preguntar } from '../portal/js/dialogos.js';
  import api from '../portal/js/api.js';
  import { getFullMeta } from '../portal/js/status_ui.js';

  // §H.8/TAREA 21: fase_08 y fase_10 son las únicas fases manuales. fase_08
  // exige DOS confirmaciones (legal=abogado, técnica/matrices=regente) antes
  // de que el ANALISTA la avance a fase_09; fase_10 la confirma el analista
  // solo. Esto NO decide permisos — solo arma la etiqueta "acción
  // pendiente"; el backend (tracker/middleware/permissions.js
  // `canTransitionCase` + el gate de confirmaciones en cases.js) rechaza
  // igual cualquier intento fuera de rol aunque esta etiqueta se equivoque.

  let statusMeta, role;

  async function init() {
    if (!(await initBackoffice())) return;

    const myPerms = await api.getMyPermissions();
    role = myPerms.role;
    // TAREA 35: "Empresas" ahora también es para el staff (necesita llegar
    // a "Cargar diagnóstico") — se muestra según el permiso real
    // (orgs.list), no hardcodeado a role==='admin'. "Precios" sigue siendo
    // solo admin.
    if (myPerms.permissions.includes('orgs.list')) {
      document.getElementById('nav-empresas').style.display = '';
    }
    document.getElementById('rol-intro').textContent = {
      analista: 'Casos asignados a ti — avanzas todas las fases secuenciales, y la fase 8 (cuando las dos confirmaciones ya estén) y la fase 10.',
      abogado:  'Casos asignados a ti — confirmas la parte LEGAL de la fase 8 (poderes/declaraciones); la técnica/matrices la confirma el regente.',
      regente:  'Casos asignados a ti — confirmas la parte TÉCNICA/matrices de la fase 8; la legal la confirma el abogado.',
      admin:    'Todos los expedientes — usa Expedientes para el listado completo o Empresas para gestión.',
    }[role] || '';

    statusMeta = await getFullMeta();
    await loadBandeja();
    await loadLeads(); // TAREA 32 (§H.13) — "Clientes nuevos — revisar captación"
    await loadContactLeads(); // TAREA 34 (§H.15) — "Enviar consulta" del hero, sin cuenta
    if (myPerms.permissions.includes('payments.review')) await loadRevisionesPago();
  }

  // Pagos por revisar: lo que dejó el webhook de PayPal o un cambio de plan. Marcar
  // resuelta pide una nota corta (qué se hizo), que queda guardada con la revisión.
  async function loadRevisionesPago() {
    const card = document.getElementById('revisiones-card');
    const list = document.getElementById('revisiones-list');
    try {
      const { revisiones } = await api.getRevisionesPago();
      if (!revisiones.length) { card.classList.add('d-none'); return; }

      list.innerHTML = revisiones.map(r => `
        <div class="list-group-item d-flex justify-content-between align-items-start gap-3" data-revision-id="${esc(r.id)}">
          <div>
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle me-2">PayPal</span>
            <span class="small">${esc(r.motivo)}</span>
            <div class="text-muted" style="font-size:.72rem">
              ${new Date(r.creadaEn).toLocaleString('es-PA')}
              ${r.orgId ? ` · Empresa ${esc(r.orgId)}` : ''}${r.quoteId ? ` · Cotización ${esc(r.quoteId)}` : ''}${r.recursoId ? ` · Ref. PayPal ${esc(r.recursoId)}` : ''}
            </div>
          </div>
          <button class="btn btn-sm btn-outline-secondary flex-shrink-0 btn-resolver-revision">Marcar resuelta</button>
        </div>`).join('');

      list.querySelectorAll('.btn-resolver-revision').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const row = e.target.closest('[data-revision-id]');
          const nota = await preguntar('¿Qué se hizo? (opcional)');
          if (nota === null) return;
          btn.disabled = true;
          try {
            await api.resolverRevisionPago(row.dataset.revisionId, nota);
            row.remove();
            if (!list.children.length) card.classList.add('d-none');
          } catch (err) {
            btn.disabled = false;
            await avisar(err.message);
          }
        });
      });

      card.classList.remove('d-none');
    } catch (err) {
      // Que falle la carga no puede parecer "no hay nada por revisar".
      list.innerHTML = `<div class="list-group-item small text-danger">No se pudieron cargar los pagos por revisar: ${esc(err.message)}</div>`;
      card.classList.remove('d-none');
    }
  }

  // TAREA 32 (§H.13): leads de registro abierto, todavía sin caso — por eso
  // es una card aparte y no una fila de #bandeja-table (esa tabla es de
  // CASOS). orgs.read_leads ya cubre staff+admin, por eso no hay otro check
  // de rol acá (si el permiso 403, el catch lo oculta silencioso).
  async function loadLeads() {
    try {
      const { leads } = await api.getLeads();
      const card = document.getElementById('leads-card');
      const list = document.getElementById('leads-list');
      if (!leads.length) { card.classList.add('d-none'); return; }

      list.innerHTML = leads.map(org => `
        <div class="list-group-item d-flex justify-content-between align-items-center" data-org-id="${esc(org.id)}">
          <div>
            <span class="badge bg-warning text-dark me-2">Cliente nuevo</span>
            <strong class="small">${esc(org.nombre)}</strong>
            <span class="text-muted small"> — ${esc(org.captacion.paisYNombreFabricante)}, ${esc((org.captacion.categoriasProducto || []).join('/'))}</span>
          </div>
          <button class="btn btn-sm btn-outline-secondary btn-marcar-revisado">Marcar revisado</button>
        </div>`).join('');

      list.querySelectorAll('.btn-marcar-revisado').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const row = e.target.closest('[data-org-id]');
          btn.disabled = true;
          try {
            await api.marcarLeadRevisado(row.dataset.orgId);
            row.remove();
            if (!list.children.length) card.classList.add('d-none');
          } catch (err) {
            btn.disabled = false;
            await avisar(err.message);
          }
        });
      });

      card.classList.remove('d-none');
    } catch (e) { /* sin permiso o sin leads — no romper el resto de la bandeja */ }
  }

  // TAREA 34 (§H.15): "Enviar consulta" del hero — sin cuenta, por eso
  // "Invitar a crear cuenta" (pide el nombre de la empresa y crea
  // org+invitación con el correo del lead, reusa invitations.js).
  async function loadContactLeads() {
    try {
      const { leads } = await api.getContactLeads();
      const card = document.getElementById('contact-leads-card');
      const list = document.getElementById('contact-leads-list');
      if (!leads.length) { card.classList.add('d-none'); return; }

      list.innerHTML = leads.map(l => `
        <div class="list-group-item d-flex justify-content-between align-items-center" data-lead-id="${esc(l.id)}">
          <div>
            <strong class="small">${esc(l.nombre)}</strong>
            <span class="text-muted small"> — ${esc(l.correo)}${l.empresa ? `, ${esc(l.empresa)}` : ''}${l.tipoProducto ? ` (${esc(l.tipoProducto)})` : ''}</span>
          </div>
          <button class="btn btn-sm btn-outline-primary btn-invitar-lead">Invitar a crear cuenta</button>
        </div>`).join('');

      list.querySelectorAll('.btn-invitar-lead').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const row = e.target.closest('[data-lead-id]');
          const orgName = await preguntar('Nombre de la empresa para esta invitación:');
          if (!orgName) return;
          btn.disabled = true;
          try {
            await api.invitarContactLead(row.dataset.leadId, orgName);
            row.remove();
            if (!list.children.length) card.classList.add('d-none');
          } catch (err) {
            btn.disabled = false;
            await avisar(err.message);
          }
        });
      });

      card.classList.remove('d-none');
    } catch (e) { /* sin permiso o sin leads — no romper el resto de la bandeja */ }
  }

  async function loadBandeja() {
    try {
      const { cases } = await api.listCases();
      const activos = cases.filter(c => c.status !== 'deleted' && !statusMeta.terminal.includes(c.status));

      const docLists = await Promise.all(activos.map(c => api.listDocuments(c.id).catch(() => ({ documents: [] }))));

      const rows = activos.map((c, i) => {
        const docsPendientes = (docLists[i].documents || []).filter(d => d.status === 'uploaded').length;
        return { caso: c, docsPendientes };
      });

      renderTable(rows);
    } catch (e) {
      document.getElementById('bandeja-tbody').innerHTML = `<tr><td colspan="5" class="text-danger text-center py-4">${esc(e.message)}</td></tr>`;
    }
  }

  function accionPendiente(c, docsPendientes) {
    const faseLabel = statusMeta.statuses.includes(c.status) ? (statusMeta.meta[c.status]?.label || c.status) : `${c.status} (sin migrar)`;
    const partes = [];

    if (c.status === 'fase_08') {
      const conf = c.confirmacionesFase8 || {};
      if (role === 'abogado') {
        partes.push(conf.legal
          ? { texto: 'Fase 8 — tu confirmación legal ya quedó registrada (esperando la técnica/matrices)', actionable: false }
          : { texto: 'Fase 8 — confirmar revisión legal (poderes/declaraciones)', actionable: true });
      } else if (role === 'regente') {
        partes.push(conf.tecnica
          ? { texto: 'Fase 8 — tu confirmación técnica/matrices ya quedó registrada (esperando la legal)', actionable: false }
          : { texto: 'Fase 8 — confirmar cotejo técnico/matrices', actionable: true });
      } else if (role === 'analista' || role === 'admin') {
        const faltan = [!conf.legal && 'legal', !conf.tecnica && 'técnica/matrices'].filter(Boolean);
        partes.push(faltan.length
          ? { texto: `Fase 8 — esperando confirmación ${faltan.join(' y ')}`, actionable: false }
          : { texto: 'Fase 8 — las dos confirmaciones están listas, avanzar a fase 9', actionable: true });
      } else {
        partes.push({ texto: `En ${faseLabel} — sin acción tuya pendiente ahora`, actionable: false });
      }
    } else if (c.status === 'fase_10') {
      if (role === 'analista' || role === 'admin') {
        partes.push({ texto: 'Fase 10 — confirmar recepción y verificación de originales', actionable: true });
      } else {
        partes.push({ texto: `En ${faseLabel} — no es tu confirmación todavía`, actionable: false });
      }
    } else if (role === 'analista' || role === 'admin') {
      partes.push({ texto: `En curso: ${faseLabel}`, actionable: false });
    } else {
      partes.push({ texto: `En ${faseLabel} — sin acción tuya pendiente ahora`, actionable: false });
    }

    if (docsPendientes > 0) {
      partes.push({ texto: `${docsPendientes} documento${docsPendientes > 1 ? 's' : ''} por revisar`, actionable: true });
    }
    return partes;
  }

  function renderTable(rows) {
    const tbody = document.getElementById('bandeja-tbody');
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No tienes expedientes asignados.</td></tr>'; return; }

    tbody.innerHTML = rows.map(({ caso: c, docsPendientes }) => {
      const faseLabel = statusMeta.statuses.includes(c.status) ? (statusMeta.meta[c.status]?.label || c.status) : `${c.status} (sin migrar)`;
      const acciones = accionPendiente(c, docsPendientes);
      const accionesHtml = acciones.map(a =>
        `<span class="badge ${a.actionable ? 'accion-actionable' : 'accion-waiting'} d-block mb-1 text-start">${esc(a.texto)}</span>`
      ).join('');

      return `<tr class="bandeja-row" onclick="window.location.href='/admin/expediente.html?id=${encodeURIComponent(c.id)}'">
        <td class="ps-4 py-3">
          <div class="fw-semibold small">${esc(c.productName || '(sin nombre)')}</div>
          <div class="text-muted" style="font-size:.72rem">${esc(c.caseCode || c.id)}</div>
        </td>
        <td class="small text-muted">${esc(c.clientEmail || '—')}</td>
        <td><span class="badge bg-secondary rounded-pill">${esc(faseLabel)}</span></td>
        <td>${accionesHtml}</td>
        <td><i class="bi bi-chevron-right text-muted"></i></td>
      </tr>`;
    }).join('');
  }

  init();
</script>
</body>
</html>
