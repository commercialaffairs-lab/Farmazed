<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title data-i18n>Acceso | Farmazed</title>
    <script src="/portal/js/i18n.js"></script>
    <link rel="icon" type="image/png" href="src/images/favicon_Farzed.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #0d4f80 0%, #2190d7 55%, #1572b0 100%);
            font-family: 'Open Sans', sans-serif;
        }

        /* Grid overlay — same as hero */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ── Card ── */
        .fz-card {
            position: relative;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.28);
            width: 100%;
            max-width: 400px;
            margin: 24px 16px;
            overflow: hidden;
        }

        /* Blue accent bar at top */
        .fz-card-top {
            background: linear-gradient(135deg, #0d4f80 0%, #2190d7 100%);
            padding: 32px 32px 28px;
            text-align: center;
        }

        .fz-card-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 4px;
        }

        .fz-card-logo img {
            height: 56px;
            width: auto;
            object-fit: contain;
        }

        .fz-card-logo-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: #fff;
            line-height: 1.15;
            letter-spacing: 0.03em;
            text-align: left;
        }

        .fz-card-logo-text small {
            display: block;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Open Sans', sans-serif;
            font-weight: 400;
        }

        .fz-card-subtitle {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            font-weight: 300;
            color: rgba(255,255,255,0.65);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-top: 10px;
        }

        /* ── Form body ── */
        .fz-card-body {
            padding: 32px 32px 28px;
        }

        .fz-field {
            margin-bottom: 18px;
        }

        .fz-field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .fz-field input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #dde3e8;
            border-radius: 3px;
            font-family: 'Open Sans', sans-serif;
            font-size: 0.875rem;
            color: #333;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafcfe;
        }

        .fz-field input:focus {
            border-color: #2190d7;
            box-shadow: 0 0 0 3px rgba(33,144,215,0.12);
            background: #fff;
        }

        .fz-login-btn {
            width: 100%;
            padding: 13px;
            background: #2190d7;
            color: #fff;
            border: none;
            border-radius: 3px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .fz-login-btn:hover { background: #0d4f80; }

        #login-msg {
            font-size: 0.78rem;
            color: #c0392b;
            text-align: center;
            margin-top: 10px;
            min-height: 18px;
        }

        /* ── Footer links ── */
        .fz-card-footer {
            padding: 14px 32px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0f0f0;
        }

        .fz-card-footer a {
            font-size: 0.75rem;
            color: #2190d7;
            text-decoration: none;
        }

        .fz-card-footer a:hover { text-decoration: underline; }

        .fz-card-footer span {
            font-size: 0.75rem;
            color: #ccc;
        }

        /* ── Copyright ── */
        .fz-login-copy {
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.04em;
        }

        /* ── Mobile ── */
        @media (max-width: 480px) {
            .fz-card-top { padding: 24px 24px 20px; }
            .fz-card-body { padding: 24px 24px 20px; }
            .fz-card-footer { padding: 12px 24px 18px; flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="fz-card">

        <div class="fz-card-top">
            <a href="index.html" class="fz-card-logo">
                <img src="src/images/Logo.png" alt="Farmazed">
                <div class="fz-card-logo-text">
                    Farmazed
                    <small data-i18n>Asuntos Regulatorios</small>
                </div>
            </a>
            <div class="fz-card-subtitle" data-i18n>Portal de Clientes</div>
        </div>

        <div class="fz-card-body">
            <form id="login-form" autocomplete="off">
                <div class="fz-field">
                    <label for="usuario" data-i18n>Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Correo electrónico" autocomplete="username" data-i18n-attr="placeholder">
                </div>
                <div class="fz-field">
                    <label for="password" data-i18n>Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="fz-login-btn" data-i18n>Ingresar</button>
                <div id="login-msg"></div>
            </form>
            <div class="text-center mt-3" style="text-align:center;margin-top:14px;">
                <a href="/solicitar-cuenta.html" style="font-size:.82rem" data-i18n>Solicitar cuenta</a>
            </div>
            <!-- Idiomas (Rick, 01-nov-2026: la demo oficial en ES/EN/FR/PT, sin mezclas) -->
            <div id="login-idioma" class="d-flex justify-content-center mt-3" style="display:flex;justify-content:center;margin-top:14px;"></div>
        </div>

        <div class="fz-card-footer">
            <a href="#" id="link-olvido" data-i18n>¿Olvidó su contraseña?</a>
            <span>·</span>
            <a href="index.html" data-i18n>← Volver al sitio</a>
        </div>

        <div style="padding: 0 32px 24px;">
            <a href="index.html" style="
                display: block;
                text-align: center;
                padding: 10px;
                border: 1px solid #dde3e8;
                border-radius: 3px;
                font-family: 'Open Sans', sans-serif;
                font-size: 0.82rem;
                color: #666;
                text-decoration: none;
                transition: background 0.2s, color 0.2s;
            " onmouseover="this.style.background='#f4f7fa';this.style.color='#2190d7'"
               onmouseout="this.style.background='';this.style.color='#666'"
               data-i18n>
                ← Volver a la página principal
            </a>
        </div>

    </div>

    <div class="fz-login-copy" data-i18n>&copy; 2026 Farmazed &middot; Panamá</div>

    <script type="module">
        import { login, auth, isAdmin, isStaff } from './portal/js/auth.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
        const { t } = window.FZI18N;

        // admin -> admin/casos.html (panel v2 real); staff (analista/abogado/
        // regente) -> admin/bandeja.html; cliente (titular/miembro) ->
        // client-dashboard.html. dashboard.html NO es destino de login: es la
        // especificación de diseño del v2 (ver CLAUDE.md), no está conectada
        // a los flujos reales (sus links de "Ver expediente"/"Descargar
        // matriz" son "#").
        async function destinoSegunRol() {
            if (await isAdmin()) return 'admin/casos.html';
            if (await isStaff()) return 'admin/bandeja.html';
            return 'client-dashboard.html';
        }

        // Already logged in? Skip straight to the right destino.
        onAuthStateChanged(auth, async (user) => {
            if (user) window.location.href = await destinoSegunRol();
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var msg = document.getElementById('login-msg');
            var user = document.getElementById('usuario').value.trim();
            var pass = document.getElementById('password').value;
            if (!user || !pass) {
                msg.textContent = t('Complete todos los campos.');
                return;
            }
            msg.style.color = '#2190d7';
            msg.textContent = t('Verificando credenciales…');
            try {
                await login(user, pass);
                window.location.href = await destinoSegunRol();
            } catch (err) {
                msg.style.color = '#c0392b';
                msg.textContent = t('Usuario o contraseña incorrectos.');
            }
        });
    </script>

    <script type="module">
      // "¿Olvidó su contraseña?" (decisión 14 de Rick, 31-oct-2026): usa el correo del campo
      // Usuario; el servidor manda el correo de marca con el enlace de Firebase para definir una
      // contraseña nueva. Misma respuesta exista o no la cuenta.
      import { API_BASE } from './portal/js/auth.js';
      import { avisar } from './portal/js/dialogos.js';
      const { t } = window.FZI18N;
      document.getElementById('link-olvido').addEventListener('click', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('login-msg');
        const correo = document.getElementById('usuario').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
          msg.style.color = '#c0392b';
          msg.textContent = t('Escribe tu correo en el campo Usuario y vuelve a pulsar "¿Olvidó su contraseña?".');
          return;
        }
        msg.style.color = '#2190d7';
        msg.textContent = t('Enviando…');
        try {
          const res = await fetch(`${API_BASE}/api/register/restablecer`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ correo }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          msg.style.color = '#2e7d32';
          msg.textContent = t('Si existe una cuenta con {correo}, te enviamos un correo para definir una contraseña nueva.', { correo });
          // Rick (02-nov-2026): además del aviso en línea, un modal que confirme el envío y diga qué hacer.
          await avisar(
            t('Si existe una cuenta con {correo}, Farmazed te envió un correo desde info@farmazed.com con el enlace para definir una contraseña nueva. El enlace vence en 1 hora. Si no lo ves en unos minutos, revisa la carpeta de spam o correo no deseado.', { correo }),
            { tipo: 'exito', titulo: t('Correo enviado'), ok: t('Entendido') },
          );
        } catch (err) {
          msg.style.color = '#c0392b';
          msg.textContent = err.message;
          await avisar(t('No se pudo enviar el correo: {error}. Intenta de nuevo en unos minutos.', { error: err.message }), { tipo: 'error', titulo: t('No se pudo enviar') });
        }
      });
    </script>

    <script>
      // Selector ES · EN · FR · PT (fondo blanco de la tarjeta -> variante oscura).
      FZI18N.montarSelector('#login-idioma', { oscuro: true });

      // aceptar-invitacion.html manda aquí tras crear la contraseña (31-oct-2026).
      // Se espera a que cargue el diccionario (FZI18N.listo) para no pintar el aviso en español
      // y que un instante después aparezca traducido.
      if (new URLSearchParams(location.search).get("cuenta") === "creada") {
        FZI18N.listo.then(function () {
          var m = document.getElementById("login-msg");
          m.style.color = "#2e7d32";
          m.textContent = FZI18N.t("Cuenta creada. Inicia sesión con tu correo y la contraseña que acabas de elegir.");
        });
      }
    </script>
</body>
</html>
