server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html/farmazed-web;
    index index.html;

    # Cabeceras de seguridad básicas (02-nov-2026). nginx NO hereda add_header en un location
    # que define los suyos, por eso se repiten en los bloques de caché de abajo.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Caché del navegador (02-nov-2026): sin estas cabeceras Chrome guardaba HTML y JS por
    # heurística y, tras un despliegue, mezclaba páginas nuevas con scripts viejos (barras
    # laterales distintas, botones que no aparecían). HTML/JSON/JS/CSS se revalidan en cada
    # carga (nginx responde 304 si no cambiaron); imágenes y fuentes se guardan un día.
    location ~* \.(html|json|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|pdf)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location = /qr {
        return 302 https://farmazed-tracker-267037695065.us-central1.run.app/qr;
    }

    location /portal/ {
        root /usr/share/nginx/html/farmazed-web;
        try_files $uri $uri/ /login.html;
    }

    location /admin/ {
        root /usr/share/nginx/html/farmazed-web;
        try_files $uri $uri/ /admin/casos.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
